<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestie · Heaven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --G:linear-gradient(110deg,#F5E0A0,#E8B870,#BFA5D8,#2CB7A7,#167A6B);
    --G135:linear-gradient(135deg,#F5E0A0 0%,#E8B870 22%,#BFA5D8 52%,#2CB7A7 78%,#167A6B 100%);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Jost',sans-serif;font-weight:300;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;color:#000;min-height:100vh;
    background-color:#F2ECE4;
    background-image:linear-gradient(rgba(0,0,0,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.08) 1px,transparent 1px);
    background-size:22px 22px;
  }
  button,input{font-family:inherit}

  /* ---------- HQ shell: sidebar, title bar ---------- */
  .adm{display:flex;min-height:100vh}
  .adm-side{width:236px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;background:#000;color:#F2ECE4;padding:22px 14px 24px}
  .adm-main{flex:1;min-width:0;padding:28px 20px 48px}
  .adm-in{margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .adm-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
  .adm-brand img{width:34px;height:34px;object-fit:contain}
  .adm-brand .t1{font-size:15px}
  .adm-brand .t2{font-size:14px;letter-spacing:.2em}
  .adm-gh{display:flex;width:100%;justify-content:space-between;align-items:center;padding:8px 12px;color:#F2ECE4;font-size:13px;letter-spacing:.24em;text-transform:uppercase}
  .adm-grp{margin-bottom:10px}
  .adm-gh span:last-child{font-size:16px}
  .adm-nb{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:12px;background:none;color:#F2ECE4;font:inherit;font-size:15px;cursor:pointer;text-align:left;text-decoration:none}
  .adm-nb:hover{background:rgba(242,236,228,.08)}
  .adm-srch{display:block;width:calc(100% - 8px);margin:0 4px 16px;padding:7px 12px;border-radius:20px;border:1px solid #F2ECE4;background:#000;color:#F2ECE4;font:inherit;font-size:14px}
  .adm-srch::placeholder{color:#F2ECE4;opacity:.62}
  .adm-off{cursor:default}
  .adm-off:hover{background:none}
  .adm-nb.on{background:var(--G);color:#000}
  .adm-nb i{font-style:normal;width:18px;text-align:center}
  .adm-title{display:flex;align-items:center;gap:12px;padding:6px 14px;border-radius:16px;background:#000;color:#F2ECE4;margin-bottom:4px}
  .adm-ti{width:44px;height:28px;border-radius:9px;color:#000;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--G)}
  .adm-title .adm-h1{font-weight:300;font-size:20px;margin:0;line-height:1.2}

  /* ---------- Heaven to Earth (HeavenGarden.jsx, HeavenStages.jsx) ---------- */
  .hg-root{background-color:#F2ECE4;background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);background-size:26px 26px;color:#000;font-family:Jost,sans-serif;font-style:normal;border-radius:22px;padding:clamp(14px,2.4vw,32px);display:flex;flex-direction:column;gap:26px;width:100%;overflow:hidden;position:relative}
  .hg-top{display:flex;align-items:center;justify-content:center;gap:10px 14px;flex-wrap:wrap}
  .hg-pillh{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 6px;border-radius:999px;background:#F2ECE4;color:#000;font-size:16px;font-weight:400;letter-spacing:.14em;text-transform:uppercase}
  .hg-pillh img{height:24px;width:auto}
  .hg-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hg-stat{display:inline-flex;align-items:baseline;gap:8px;padding:6px 18px;border-radius:999px;border:1px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;color:#000}
  .hg-stat b{font-size:30px;font-weight:300;line-height:1.1}
  .hg-stat span{font-size:15px;letter-spacing:.14em;text-transform:uppercase}

  .hs-catchrow{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:8px}
  .hs-catch{display:flex;gap:8px;max-width:640px;width:100%;min-width:0;align-items:center}
  .hs-field{background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;border:1px solid transparent;border-radius:14px;color:#000;font:inherit;font-size:16px;padding:8px 12px;box-sizing:border-box;min-width:0;flex:1;width:100%}
  .hs-field::placeholder{color:rgba(0,0,0,.6)}
  .hs-field:focus{outline:1px dashed #000;outline-offset:2px}
  .hs-cta{background:var(--G);border:none;border-radius:999px;padding:7px 16px;color:#000;font:inherit;font-size:15px;cursor:pointer}
  .hs-cta:disabled{opacity:.45;cursor:default}
  .hs-btn{background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;border:1px solid transparent;border-radius:999px;padding:5px 14px;color:#000;font:inherit;font-size:14px;cursor:pointer;line-height:1.35}
  .hs-wrap{display:flex;flex-direction:column;gap:14px;min-width:0;color:#000;font-family:Jost,sans-serif}
  .hs-note{font-size:14px;line-height:1.5;text-align:center}
  .hs-note:empty,#hgPanel:empty{display:none}
  .dc-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;cursor:pointer;padding:0}
  .dc-btn svg{width:20px;height:20px;display:block}
  .dc-btn.on{background:var(--G);box-shadow:0 0 0 3px #E8B870}

  .hg-skywrap{display:flex;justify-content:center;min-width:0}
  .hg-sky{display:block;width:100%;height:auto;max-height:max(330px,calc(100vh - 330px))}
  .hg-sky.tall{max-height:none}
  .hg-t{cursor:pointer}
  .hg-t:focus{outline:none}
  .hg-t:focus-visible [data-orb],.hg-t:focus-visible circle{stroke-dasharray:3 4}
  .hg-btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .hg-opt{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;border:1px solid transparent;border-radius:999px;padding:7px 18px;color:#000;font:inherit;font-size:16px;cursor:pointer;line-height:1.3}
  .hg-opt.on{background:var(--G)}
  .hg-opt:focus-visible{outline:1px dashed #000;outline-offset:3px}
  .hg-optn{font-size:13px;padding:0 8px;border-radius:999px;border:1px solid #000;line-height:1.5}

  /* Cream panel and idea rows (GlowPanel cream, HeavenStrip rows) */
  .hqg-panel{position:relative;border-radius:16px;border:1px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;color:#000;padding:clamp(14px,2vw,22px);box-sizing:border-box}
  .hg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
  .hg-h{font-size:19px;font-weight:400}
  .hqg-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:13px;line-height:1.4;white-space:nowrap;border:1px solid #000;font-weight:400}
  .hg-btn{background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;border:1px solid transparent;border-radius:30px;padding:5px 14px;color:#000;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .hg-btn:disabled{opacity:.45;cursor:default}
  .hg-btn:focus-visible{outline:1px dashed #000;outline-offset:3px}
  .stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .themes{display:flex;flex-direction:column;gap:18px}
  .th-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .th-i{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;border:1.5px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box}
  .th-i img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;display:block;max-width:none}
  .th-h b{font-weight:400;font-size:20px}
  .th-h span{font-size:14px}
  .hv-l{display:flex;flex-direction:column;gap:8px}
  .hv-i{border:1px solid #000;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;background:#F2ECE4;color:#000}
  .hv-i p{margin:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
  .hv-i div{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .hv-i i{font-style:normal;font-size:13px;border:1px solid #000;border-radius:999px;padding:0 9px;line-height:22px}
  .hv-i .st{background:var(--G);border-color:transparent}
  .col-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;margin:0 0 8px}
  .empty{font-size:14px}

  /* Phone: sidebar becomes a top bar */
  @media(max-width:700px){
    .hg-stats{width:100%;flex-wrap:nowrap;gap:6px}
    .hg-stat{flex:1 1 0;min-width:0;flex-direction:column;align-items:center;gap:0;padding:4px 4px;border-radius:18px}
    .hg-stat b{font-size:24px}
    .hg-stat span{font-size:11px;letter-spacing:.05em;white-space:nowrap}
    .hg-opt{padding:6px 14px;font-size:15px}
    .stages{grid-template-columns:1fr}
  }
  @media(max-width:820px){
    .adm{flex-direction:column}
    .adm-side{position:static;width:100%;height:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 12px}
    .adm-brand{padding:0}
    .adm-gh,.adm-srch,.adm-off{display:none}
    .adm-grp{margin:0;display:flex;gap:6px;flex-wrap:wrap}
    .adm-nb{width:auto;padding:8px 14px;border:1px solid #F2ECE4;border-radius:30px}
    .adm-nb.on{border-color:transparent}
    .adm-main{padding:16px 10px 40px}
    .adm-title{padding:3px 10px;border-radius:12px;gap:8px}
    .adm-ti{width:26px;height:20px;font-size:12px;border-radius:6px}
    .adm-title .adm-h1{font-size:15px}
  }
</style>
</head>

    return '<image href="' + iconOf(t) + '" x="' + (-S / 2) + '" y="' + (-S / 2) + '" width="' + S + '" height="' + S + '" clip-path="url(#hgIconClip)" preserveAspectRatio="xMidYMid slice"/>';
  }

  // ---- Layout: desktop picture (1200 x 580) and phone picture (400 x 672) ----
  function layoutOf(tall, N) {
    var span = Math.max(1, N - 1);
    if (!tall) {
      var step = Math.min(940 / span, 128), x0 = 600 - (step * span) / 2;
      var xs = function (k) { return x0 + k * step; };
      return { W: 1200, H: 580, ground: 470, ps: 0.6, treeX: 600, treeS: 0.42, lab: 15, sub: 13.5, gap: 46,
        orb: function (k) { return { x: xs(k), y: 168, r: 24 }; }, plantX: xs, gem: function (k) { return { x: xs(k), y: 526, r: 15 }; }, cloud: 'translate(21,0)' };
    }
    var st = Math.min(52, 348 / span), p0 = 200 - (st * span) / 2, rows = Math.ceil(N / 3);
    var px = function (k) { return p0 + k * st; };
    return { W: 400, H: 672, ground: 584, ps: 0.4, treeX: 200, treeS: 0.24, lab: 15, sub: 13.5, gap: 0, tall: true, funnel: [200, 112 + (rows - 1) * 88 + 86],
      orb: function (k) { return { x: 70 + (k % 3) * 130, y: 112 + Math.floor(k / 3) * 88, r: 22 }; }, plantX: px, gem: function (k) { return { x: px(k), y: 626, r: 11 }; }, cloud: 'translate(20,0) scale(.36,.5)' };
  }
  function bez(p0, p1, p2, p3, t) {
    var u = 1 - t;
    return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
  }

  function buildModel() {
    return D.themes.map(function (t, k) {
      var n = function (s) { return t.ideas.filter(function (i) { return i.stage === s; }).length; };
      var up = n('heaven'), grow = n('eden'), down = n('earth');
      var col = t.name === 'Other' ? INK : BRAND[k % 5];
      return { n: t.name, k: k, up: up, grow: grow, down: down, stage: stageOf(up, grow, down), col: col, theme: t };
    });
  }

  // ---- The Heaven to Earth picture (SkyHero in HeavenGarden.jsx) ----
  function sky(M, sel, tall) {
    var L = layoutOf(tall, M.length);
    var totalUp = 0, totalGrow = 0, totalDown = 0;
    M.forEach(function (t) { totalUp += t.up; totalGrow += t.grow; totalDown += t.down; });
    var ts = L.treeS, tt = 'translate(' + (L.treeX - ts * 600) + ',' + (L.ground - ts * 792) + ') scale(' + ts + ')';
    var s = '<svg viewBox="0 0 ' + L.W + ' ' + L.H + '" class="hg-sky' + (tall ? ' tall' : '') + '" role="group" aria-label="From Heaven to Earth. ' + totalUp + ' in Heaven, ' + totalGrow + ' growing in Eden, ' + totalDown + ' on Earth. Tap a theme to open it.">';

    // gradients, the icon clip and one rose gradient per theme
    s += '<defs>';
    s += '<linearGradient id="hgOB" x1="0" y1="0" x2="1" y2="1">' + BRAND.map(function (c, i) { return '<stop offset="' + i / 4 + '" stop-color="' + c + '"/>'; }).join('') + '</linearGradient>';
    s += '<clipPath id="hgIconClip" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r="' + ICON_CLIP + '"/></clipPath>';
    s += '<linearGradient id="hgCloudF" x1="0" y1="0" x2="1" y2="0">' + BRAND.map(function (c, i) { return '<stop offset="' + i / 4 + '" stop-color="' + c + '" stop-opacity=".26"/>'; }).join('') + '</linearGradient>';
    s += '<linearGradient id="hgCloudS" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1060" y2="0">' + BRAND.map(function (c, i) { return '<stop offset="' + i / 4 + '" stop-color="' + c + '"/>'; }).join('') + '</linearGradient>';
    s += '<linearGradient id="hgFallG" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="' + L.ground + '"><stop offset="0" stop-color="#E8B870"/><stop offset=".45" stop-color="#BFA5D8"/><stop offset="1" stop-color="#2CB7A7"/></linearGradient>';
    s += '<linearGradient id="hgTree" gradientUnits="userSpaceOnUse" x1="0" y1="900" x2="0" y2="320"><stop offset="0" stop-color="#167A6B"/><stop offset=".45" stop-color="#2CB7A7"/><stop offset=".75" stop-color="#BFA5D8"/><stop offset="1" stop-color="#E8B870"/></linearGradient>';
    s += '<linearGradient id="hgStemP" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-150"><stop offset="0" stop-color="#167A6B"/><stop offset=".6" stop-color="#2CB7A7"/><stop offset="1" stop-color="#E8B870"/></linearGradient>';
    s += '<linearGradient id="hgGround" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="' + L.W + '" y2="0">' + BRAND.map(function (c, i) { return '<stop offset="' + i / 4 + '" stop-color="' + c + '"/>'; }).join('') + '</linearGradient>';
    M.forEach(function (t) {
      var next = t.col === INK ? '#BFA5D8' : BRAND[(BRAND.indexOf(t.col) + 2) % BRAND.length];
      s += '<linearGradient id="hgRose' + t.k + '" gradientUnits="userSpaceOnUse" x1="-24" y1="-30" x2="24" y2="10"><stop offset="0" stop-color="' + t.col + '"/><stop offset=".55" stop-color="' + INK + '"/><stop offset="1" stop-color="' + next + '"/></linearGradient>';
    });
    s += '</defs>';

    // HEAVEN: a soft layered cloud, fine line with a pale gradient fill
    s += '<g transform="' + L.cloud + '"><path d="' + CLOUD + '" fill="url(#hgCloudF)" stroke="url(#hgCloudS)" stroke-width="1.6"' + NS + '/>' +
      '<path d="' + CLOUD_IN + '" fill="none" stroke="url(#hgCloudS)" stroke-width="1"' + NS + '/>' +
      '<path d="' + CLOUD_LOW + '" fill="none" stroke="url(#hgCloudS)" stroke-width="1"' + NS + '/></g>';
    s += '<text x="' + L.W / 2 + '" y="' + (tall ? 34 : 60) + '" text-anchor="middle" fill="#000" font-size="' + (tall ? 17 : 22) + '" letter-spacing="' + (tall ? 6 : 9) + '" font-family="' + FONT + '" font-weight="400">HEAVEN</text>';
    s += '<text x="' + L.W / 2 + '" y="' + (tall ? 54 : 84) + '" text-anchor="middle" fill="#000" font-size="' + (tall ? 13.5 : 15) + '" font-family="' + FONT + '" font-weight="300">' + totalUp + ' seeds of light waiting</text>';

    // EDEN: the tree of life (fine lines)
    s += '<g transform="' + tt + '">';
    s += '<circle cx="' + TX + '" cy="' + TY + '" r="' + TR + '" fill="none" stroke="url(#hgTree)" stroke-width="1"' + NS + '/>';
    s += '<circle cx="' + TX + '" cy="' + TY + '" r="' + (TR - 22) + '" fill="none" stroke="' + INK + '" stroke-width=".6" stroke-dasharray="2 6"' + NS + '/>';
    [[0, 0]].concat([0, 60, 120, 180, 240, 300].map(function (a) { return [60 * Math.cos((a * Math.PI) / 180), 60 * Math.sin((a * Math.PI) / 180)]; })).forEach(function (p) {
      s += '<circle cx="' + (TX + p[0]) + '" cy="' + (TY + p[1]) + '" r="60" fill="none" stroke="url(#hgTree)" stroke-width=".6" opacity=".5"' + NS + '/>';
    });
    TRUNK.forEach(function (d) { s += '<path d="' + d + '" fill="none" stroke="url(#hgTree)" stroke-width="1.3" stroke-linecap="round"' + NS + '/>'; });
    BRANCHES.forEach(function (b, i) {
      s += '<g><path d="' + b.d + '" fill="none" stroke="url(#hgTree)" stroke-width="1.1" stroke-linecap="round"' + NS + '/>' +
        '<path d="' + leafD(18, 6) + '" transform="translate(' + b.lx + ',' + b.ly + ') rotate(' + (b.a + (i % 2 ? 40 : -40)) + ')" fill="none" stroke="#2CB7A7" stroke-width=".9"' + NS + '/>' +
        '<circle cx="' + b.ex + '" cy="' + b.ey + '" r="6" fill="none" stroke="url(#hgTree)" stroke-width="1"' + NS + '/></g>';
    });
    s += '</g>';

    // the ground, grass, then Earth below it
    s += '<path d="M0,' + (L.ground + 2) + ' C' + L.W * 0.25 + ',' + (L.ground - 5) + ' ' + L.W * 0.75 + ',' + (L.ground + 7) + ' ' + L.W + ',' + (L.ground + 1) + '" fill="none" stroke="url(#hgGround)" stroke-width="1.5"/>';
    var blades = tall ? 40 : 90;
    for (var gi = 0; gi < blades; gi++) {
      var gx = 8 + gi * (L.W / blades) + rnd(gi + 40) * 4, gh = 4 + rnd(gi + 60) * 8;
      s += '<path d="M' + gx + ',' + (L.ground + 2) + ' q1.5,' + (-gh * 0.6) + ' ' + (gi % 2 ? 4 : -4) + ',' + (-gh) + '" fill="none" stroke="' + (gi % 3 ? '#2CB7A7' : '#167A6B') + '" stroke-width=".9" stroke-linecap="round"/>';
    }
    [16, 34].forEach(function (o, i) {
      s += '<path d="M0,' + (L.ground + o) + ' C' + L.W * 0.3 + ',' + (L.ground + o - 6) + ' ' + L.W * 0.7 + ',' + (L.ground + o + 6) + ' ' + L.W + ',' + (L.ground + o) + '" fill="none" stroke="url(#hgGround)" stroke-width=".7" opacity="' + (0.6 - i * 0.2) + '"/>';
    });
    if (!tall) {
      s += '<text x="14" y="' + (L.ground - 12) + '" fill="#000" font-size="14" letter-spacing="5" font-family="' + FONT + '" font-weight="400">EDEN</text>';
      s += '<text x="14" y="' + (L.ground + 62) + '" fill="#000" font-size="14" letter-spacing="5" font-family="' + FONT + '" font-weight="400">EARTH</text>';
    } else {
      s += '<text x="200" y="' + (L.ground + 28) + '" text-anchor="middle" fill="#000" font-size="14" letter-spacing="5" font-family="' + FONT + '" font-weight="400">EARTH</text>';
    }

    // one column per theme: orb, the fall of seeds, the plant, the Earth orb with its count
    M.forEach(function (t) {
      var o = L.orb(t.k), px = L.plantX(t.k), g = L.gem(t.k), m = t.down + t.grow;
      var top = L.ground - plantH(t.stage, m) * L.ps;
      var on = sel === t.n;
      var grow = t.theme.ideas.filter(function (i) { return i.stage === 'eden'; });
      var p0 = tall ? L.funnel : [o.x, o.y + o.r + L.gap];
      var p3 = [px, Math.max(top - 16, (tall ? L.funnel[1] : p0[1]) + 14)];
      var path = tall ? 'M' + p0[0] + ',' + p0[1] + ' C' + p0[0] + ',' + (p0[1] + 50) + ' ' + px + ',' + (p3[1] - 60) + ' ' + px + ',' + p3[1] : 'M' + p0[0] + ',' + p0[1] + ' L' + p3[0] + ',' + p3[1];
      var c1 = tall ? [p0[0], p0[1] + 50] : p0, c2 = tall ? [px, p3[1] - 60] : p3;
      var seeds = t.up > 40 ? [0.3, 0.55, 0.8] : t.up > 0 ? [0.4, 0.72] : [];

      s += '<g class="hg-t" role="button" tabindex="0" data-k="' + t.k + '" aria-pressed="' + on + '" aria-label="' + esc(t.n) + ': ' + t.up + ' waiting in Heaven, ' + t.grow + ' growing in Eden, ' + t.down + ' on Earth. Open.">';
      if (!tall) s += '<path d="M' + o.x + ',118 L' + o.x + ',' + (o.y - o.r) + '" fill="none" stroke="url(#hgCloudS)" stroke-width="1" stroke-dasharray="1 5"/>';
      s += '<path d="' + path + '" fill="none" stroke="url(#hgFallG)" stroke-width="' + (on ? 1.6 : 1) + '" stroke-dasharray="2 8"/>';
      seeds.forEach(function (f, j) {
        var pt = tall ? bez(p0, c1, c2, p3, f) : [p0[0] + (p3[0] - p0[0]) * f, p0[1] + (p3[1] - p0[1]) * f];
        s += '<path d="' + seedD(tall ? 0.7 : 0.85) + '" transform="translate(' + pt[0] + ',' + pt[1] + ') rotate(' + (j % 2 ? 14 : -14) + ')" fill="#F2ECE4" stroke="url(#hgFallG)" stroke-width="1"/>';
      });

      s += '<g transform="translate(' + o.x + ',' + o.y + ')">' +
        '<rect x="' + (-o.r - 12) + '" y="' + (-o.r - 8) + '" width="' + (o.r + 12) * 2 + '" height="' + (o.r * 2 + (tall ? 50 : 58)) + '" fill="transparent"/>' +
        '<circle r="' + o.r + '" fill="#F2ECE4"/>' + orbIcon(t.theme, o.r - 2) +
        '<circle data-orb r="' + o.r + '" fill="none" stroke="url(#hgOB)" stroke-width="' + (on ? 2.6 : 1.8) + '"/>' +
        (on ? '<circle r="' + (o.r + 5) + '" fill="none" stroke="' + INK + '" stroke-width="1" stroke-dasharray="2 5"/>' : '') +
        '<text y="' + (o.r + 18) + '" text-anchor="middle" fill="#000" font-size="' + L.lab + '" font-family="' + FONT + '" font-weight="400">' + esc(t.n) + '</text>' +
        '<text y="' + (o.r + 18 + 17) + '" text-anchor="middle" fill="#000" font-size="' + L.sub + '" font-family="' + FONT + '" font-weight="300">' + t.up + ' waiting</text></g>';

      var ph = plantH(t.stage, m) * L.ps;
      s += '<g transform="translate(' + px + ',' + L.ground + ')">' +
        '<rect x="-17" y="' + (-(ph + 24)) + '" width="34" height="' + (ph + 30) + '" fill="transparent"/>' +
        '<g transform="scale(' + L.ps + ')">' + plant(t.stage, m, t.k, t.col) + '</g>' +
        (on ? '<circle cy="' + (-ph * 0.5 - 8) + '" r="26" fill="none" stroke="' + INK + '" stroke-width="1" stroke-dasharray="2 5"/>' : '');
      if (!tall) {
        grow.slice(0, 4).forEach(function (it, i) {
          var sx = SPR[i] * L.ps * 1.2, sh = 14 + ((i * 7 + t.k * 3) % 10);
          s += '<g transform="translate(' + sx + ',0)"><title>' + esc(it.text) + '</title>' +
            '<path d="M0,0 C-3,' + (-sh * 0.4) + ' 3,' + (-sh * 0.7) + ' 0,' + (-sh) + '" fill="none" stroke="#2CB7A7" stroke-width="1.2" stroke-linecap="round"/>' +
            '<path d="' + leafD(8, 3.5) + '" transform="translate(0,' + (-sh) + ') rotate(-145)" fill="none" stroke="#2CB7A7" stroke-width="1"/>' +
            '<path d="' + leafD(8, 3.5) + '" transform="translate(0,' + (-sh) + ') rotate(-35)" fill="none" stroke="#2CB7A7" stroke-width="1"/></g>';
        });
      }
      s += '</g>';

      s += '<g transform="translate(' + g.x + ',' + g.y + ')">' +
        '<rect x="-18" y="' + (-g.r - 4) + '" width="36" height="' + (g.r * 2 + 32) + '" fill="transparent"/>' +
        '<circle r="' + g.r + '" fill="#F2ECE4"/>' + orbIcon(t.theme, g.r - 2) +
        '<circle r="' + g.r + '" fill="none" stroke="url(#hgOB)" stroke-width="' + (t.down ? 1.6 : 1) + '"/>' +
        '<text y="' + (g.r + 17) + '" text-anchor="middle" fill="#000" font-size="' + (tall ? 13.5 : 15) + '" font-family="' + FONT + '" font-weight="400">' + t.down + '</text></g>';
      s += '</g>';
    });
    return s + '</svg>';
  }

  // ---- Page state and rendering ----
  var S = { sel: null, open: null, tall: window.matchMedia('(max-width:700px)').matches };

  function totals(M) {
    var t = { heaven: 0, eden: 0, earth: 0 };
    M.forEach(function (m) { t.heaven += m.up; t.eden += m.grow; t.earth += m.down; });
    return t;
  }

  function ideaRow(theme, idea, ti, ii, showTheme) {
    var last = idea.stage === 'earth';
    return '<div class="hv-i"><div style="margin:0;display:block"><p>' + esc(idea.text) + '</p>' +
      '<div><i class="st">' + STAGE_LABEL[idea.stage] + '</i>' + (showTheme ? '<i>' + esc(theme.name) + '</i>' : '') + '</div></div>' +
      '<button type="button" class="hg-btn" data-t="' + ti + '" data-i="' + ii + '"' + (last ? ' disabled' : '') + '>Promote</button></div>';
  }

  function panel(M) {
    if (!S.open) return '';
    var n = totals(M);
    if (S.open === 'stages') {
      var cols = STAGES.map(function (st) {
        var rows = '';
        D.themes.forEach(function (th, ti) {
          th.ideas.forEach(function (idea, ii) { if (idea.stage === st) rows += ideaRow(th, idea, ti, ii, true); });
        });
        return '<div><div class="col-h">' + STAGE_LABEL[st] + ' · ' + STAGE_NOTE[st] + ' ' + n[st] + '</div><div class="hv-l">' + (rows || '<span class="empty">Nothing here yet.</span>') + '</div></div>';
      }).join('');
      return '<section class="hqg-panel"><div class="hg-head"><span class="hg-h">Stages</span><span class="hqg-pill">Heaven, then Eden, then Earth</span></div><div class="stages">' + cols + '</div></section>';
    }
    var only = S.sel !== null ? D.themes.filter(function (t) { return t.name === S.sel; }) : D.themes;
    var body = only.map(function (th) {
      var ti = D.themes.indexOf(th);
      var waiting = th.ideas.filter(function (i) { return i.stage === 'heaven'; }).length;
      return '<div><div class="th-h"><span class="th-i"><img src="' + iconOf(th) + '" alt=""></span><div><b>' + esc(th.name) + '</b><br><span>' + waiting + ' waiting</span></div></div>' +
        '<div class="hv-l">' + (th.ideas.map(function (idea, ii) { return ideaRow(th, idea, ti, ii, false); }).join('') || '<span class="empty">Nothing here yet.</span>') + '</div></div>';
    }).join('');
    return '<section class="hqg-panel"><div class="hg-head"><span class="hg-h">' + (S.sel ? esc(S.sel) : 'Ideas by theme') + '</span>' +
      (S.sel ? '<button type="button" class="hg-btn" id="showAll">Show every theme</button>' : '<span class="hqg-pill">Tap a theme in the picture to open it</span>') + '</div><div class="themes">' + body + '</div></section>';
  }

  function render() {
    var M = buildModel(), n = totals(M);
    document.title = 'Bestie · Heaven · ' + D.name;
    document.getElementById('brandName').textContent = D.name;
    document.getElementById('hgStats').innerHTML = [['In Heaven', n.heaven], ['Growing', n.eden], ['On Earth', n.earth]].map(function (r) {
      return '<span class="hg-stat"><b>' + r[1] + '</b><span>' + r[0] + '</span></span>';
    }).join('');
    document.getElementById('hgSky').innerHTML = sky(M, S.sel, S.tall);
    var total = n.heaven + n.eden + n.earth;
    document.getElementById('hgRow').innerHTML =
      '<button type="button" class="hg-opt' + (S.open === 'stages' ? ' on' : '') + '" data-open="stages" aria-expanded="' + (S.open === 'stages') + '">Stages<span class="hg-optn">' + total + '</span></button>' +
      '<button type="button" class="hg-opt' + (S.open === 'ideas' ? ' on' : '') + '" data-open="ideas" aria-expanded="' + (S.open === 'ideas') + '">Ideas</button>';
    document.getElementById('hgPanel').innerHTML = panel(M);
  }

  // Example board only: Promote, Add and the picture change the page in your browser, they do not save.
  // Bestie saves a real change by updating the stage (or adding the idea) in the data block.
  document.getElementById('hgSky').addEventListener('click', function (e) {
    var g = e.target.closest('.hg-t'); if (!g) return;
    var name = D.themes[+g.getAttribute('data-k')].name;
    S.sel = S.sel === name ? null : name; S.open = S.sel ? 'ideas' : S.open; render();
  });
  document.getElementById('hgSky').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var g = e.target.closest('.hg-t'); if (!g) return;
    e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  });
  document.getElementById('hgRow').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-open]'); if (!b) return;
    var k = b.getAttribute('data-open'); S.open = S.open === k ? null : k; if (k === 'ideas') S.sel = null; render();
  });
  document.getElementById('hgPanel').addEventListener('click', function (e) {
    if (e.target.id === 'showAll') { S.sel = null; render(); return; }
    var b = e.target.closest('button[data-t]'); if (!b || b.disabled) return;
    var idea = D.themes[+b.getAttribute('data-t')].ideas[+b.getAttribute('data-i')];
    if (NEXT[idea.stage]) idea.stage = NEXT[idea.stage]; render();
  });
  window.matchMedia('(max-width:700px)').addEventListener('change', function (e) { S.tall = e.matches; render(); });

  // Catch an idea: lands in Other, in Heaven
  var input = document.getElementById('catchText'), add = document.getElementById('catchAdd'), note = document.getElementById('hgNote');
  function addIdea() {
    var text = input.value.trim(); if (!text) return;
    var other = D.themes.filter(function (t) { return t.name === 'Other'; })[0];
    if (!other) { other = { name: 'Other', icon: 'network', ideas: [] }; D.themes.push(other); }
    other.ideas.push({ text: text, stage: 'heaven' });
    input.value = ''; add.disabled = true; note.textContent = 'Caught. It is in Heaven, under Other.'; render();
  }
  input.addEventListener('input', function () { add.disabled = !input.value.trim(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') addIdea(); });
  add.addEventListener('click', addIdea);
  document.getElementById('dumpBtn').addEventListener('click', function () { note.textContent = 'Tell Bestie in chat. She sorts every item and fills Heaven for you.'; });

  // Dictation uses the browser's own speech service where it has one
  var mic = document.getElementById('micBtn'), rec = null;
  mic.addEventListener('click', function () {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { note.textContent = 'Dictation is not available in this browser. Type the idea instead.'; return; }
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'en-GB'; rec.interimResults = true;
    var base = input.value ? input.value + ' ' : '';
    rec.onresult = function (ev) { var t = ''; for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript + ' '; input.value = (base + t).trim(); add.disabled = !input.value.trim(); };
    rec.onend = function () { rec = null; mic.classList.remove('on'); };
    rec.onerror = function () { note.textContent = 'Dictation stopped. Tap the mic to carry on.'; };
    try { rec.start(); mic.classList.add('on'); } catch (err) { rec = null; }
  });

  render();
})();
</script>
<script>document.querySelectorAll("img[data-logo]").forEach(function(i){i.src=document.querySelector(".adm-brand img").src})</script>
</body>
