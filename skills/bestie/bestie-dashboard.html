<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestie · CEO Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --G:linear-gradient(110deg,#F5E0A0 0%,#E8B870 22%,#BFA5D8 52%,#2CB7A7 78%,#167A6B 100%);
    --G135:linear-gradient(135deg,#F5E0A0 0%,#E8B870 22%,#BFA5D8 52%,#2CB7A7 78%,#167A6B 100%);
    --cream:#F2ECE4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Jost',sans-serif;font-weight:300;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;color:#000;min-height:100vh;
    background-color:#F2ECE4;
    background-image:linear-gradient(rgba(0,0,0,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.08) 1px,transparent 1px);
    background-size:22px 22px;
  }
  button{font-family:inherit}

  /* ---------- HQ shell: sidebar, title bar ---------- */
  .adm{display:flex;min-height:100vh}
  .adm-side{width:236px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;background:#000;color:#F2ECE4;padding:22px 14px 24px}
  .adm-main{flex:1;min-width:0;padding:28px 20px 48px}
  .adm-in{margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .adm-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
  .adm-brand img{width:34px;height:34px;object-fit:contain}
  .adm-brand .t1{font-size:15px}
  .adm-brand .t2{font-size:14px;letter-spacing:.2em}
  .adm-gh{display:flex;width:100%;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.24em;text-transform:uppercase;padding:8px 12px;border:none;background:none;color:#F2ECE4;font:inherit;font-size:13px;letter-spacing:.24em;cursor:default}
  .adm-grp{margin-bottom:10px}
  .adm-gh span:last-child{font-size:16px}
  .adm-nb{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:12px;background:none;color:#F2ECE4;font:inherit;font-size:15px;cursor:pointer;text-align:left;text-decoration:none}
  .adm-nb:hover{background:rgba(242,236,228,.08)}
  .adm-srch{display:block;width:calc(100% - 8px);margin:0 4px 16px;padding:7px 12px;border-radius:20px;border:1px solid #F2ECE4;background:#000;color:#F2ECE4;font:inherit;font-size:14px}
  .adm-srch::placeholder{color:#F2ECE4;opacity:.62}
  .adm-off{cursor:default}
  .adm-off:hover{background:none}
  .adm-nb.on{background:var(--G);color:#000}
  .adm-nb i{font-style:normal;width:18px;text-align:center}
  .adm-title{display:flex;align-items:center;gap:12px;padding:6px 14px;border-radius:16px;background:#000;color:#F2ECE4;margin-bottom:4px}
  .adm-ti{width:44px;height:28px;border-radius:9px;color:#000;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--G)}
  .adm-title .adm-h1{font-weight:300;font-size:20px;margin:0;line-height:1.2}

  /* ---------- CEO dashboard (CeoCommand.jsx) ---------- */
  .ck{position:relative;width:100%;color:#000;font-family:'Jost',sans-serif;font-weight:300;border-radius:22px;padding:clamp(12px,1.6vw,20px);display:flex;flex-direction:column;gap:12px;background-color:#F2ECE4;background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:26px 26px;overflow:clip;min-width:0}
  .clk{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-size:13px;font-weight:300;color:#000}
  .ck-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ck-p{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;line-height:1.3;white-space:nowrap;border:1px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;color:#000;min-width:0;max-width:100%}
  button.ck-p{cursor:pointer}
  .ck-p.fill{background:var(--G);color:#000;font-weight:400}
  .ck-p b{font-weight:400}
  .ck-p .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:12px;background:var(--G);color:#000;font-size:14px;font-weight:400}
  .ck-p.fill .n{background:#000;color:#F2ECE4}
  .ck-p.wrap{white-space:normal;align-items:flex-start;border-radius:18px;text-align:left;padding:8px 14px}

  /* Merge these */
  .mg{margin:0 0 8px;padding:8px 14px;border-radius:18px;border:2px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G135) border-box;color:#000;font-family:'Jost',sans-serif;margin-bottom:0}
  .mg-tog{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:inherit;color:#000;font-size:15px}
  .mg-tog b{font-weight:400}
  .mg.closed{padding:2px 14px}
  .mg-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:5px 0;font-size:15px;font-weight:300}
  .mg-n{font-weight:400;flex:none}
  .mg-t{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
  .df-b{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border:1px solid #000;border-radius:99px;background:transparent;color:#000;font:inherit;font-size:15px;cursor:pointer}

  /* Do this next + ring (DoThisNext.jsx) */
  .dn2-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:0}
  .dn2-card{flex:2 1 420px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"head left" "title title" "btns btns";align-content:center;gap:8px 12px;padding:12px 18px;border-radius:18px;border:2px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G135) border-box;color:#000}
  .dn2-head{grid-area:head;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;min-width:0}
  .dn2-lab{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#000;line-height:24px}
  .dn2-who{display:inline-flex;align-items:center;gap:6px;border:1px solid #000;border-radius:999px;padding:0 10px 0 8px;font-size:13px;line-height:22px;color:#000}
  .dn2-dia{width:8px;height:8px;transform:rotate(45deg);background:var(--G135);border:1px solid #000;flex:none}
  .dn2-t{all:unset;box-sizing:border-box;grid-area:title;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-family:'Jost',sans-serif;font-weight:400;font-size:16px;line-height:1.35;color:#000}
  .dn2-btns{grid-area:btns;display:flex;flex-wrap:wrap;gap:8px}
  .dn2-b{height:36px;min-width:92px;border-radius:999px;border:1px solid #000;background:transparent;color:#000;font:inherit;font-size:14px;font-weight:400;cursor:pointer;padding:0 16px}
  .dn2-b.go{background:var(--G135);border-color:transparent}
  .dn2-b:focus-visible{outline:2px solid #000;outline-offset:2px}
  .dn2-b:disabled{opacity:.5;cursor:default}
  .dn2-left{grid-area:left;justify-self:end;font-size:13px;line-height:24px;color:#000;text-align:right}
  .dn2-ref{grid-column:1/-1;font-size:13px;color:#000;margin-top:-4px}
  .dn2-more{all:unset;grid-column:1/-1;justify-self:start;box-sizing:border-box;cursor:pointer;font-family:'Jost',sans-serif;font-size:14px;color:#000;background:var(--G135) left bottom/100% 2px no-repeat;padding-bottom:2px}
  .dn2-ring{flex:1 1 300px;min-width:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 14px;border-radius:18px;border:1px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G135) border-box;color:#000}
  .dn2-nums{display:flex;flex-direction:column;gap:0;min-width:0}
  .dn2-num{display:flex;gap:10px;font-family:'Jost',sans-serif;color:#000;min-height:30px;align-items:center;border-bottom:1px solid transparent}
  .dn2-num b{font-weight:300;font-size:20px;line-height:1;min-width:30px}
  .dn2-num span{font-size:15px}
  .dn2-num i{font-style:normal;font-size:13px;margin-left:auto}
  .dn2-dot{width:12px;height:12px;border-radius:6px;flex:none;align-self:center}
  .dn2-strip{display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;font-size:15px;color:#000;margin:0 2px}
  .dn2-strip b{font-weight:400}
  .dn2-strip span.a{display:inline-flex;align-items:center;gap:8px}
  @media(max-width:700px){.dn2-card{padding:10px 14px;flex-basis:100%}.dn2-ring{flex-basis:100%}.dn2-b{flex:1 1 calc(50% - 4px);min-width:0;height:44px;padding:0 8px}}
  @media(max-width:380px){.dn2-ring{flex-wrap:wrap;padding:10px 12px}.dn2-nums{flex:1 1 100%}.dn2-num span{flex:1 1 auto}}

  /* Seven black jewel boxes + energy strip (BOX_CSS) */
  .cb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
  .cb-t{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:8px;min-height:196px;padding:18px 8px 16px;min-width:0;border:1.5px solid transparent;border-radius:22px;background:linear-gradient(#000,#000) padding-box,var(--G) border-box;color:#F2ECE4;font:inherit;font-weight:300;box-sizing:border-box}
  .cb-l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;line-height:1.3;overflow-wrap:anywhere}
  .cb-v{font-size:17px;font-weight:300;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#F2ECE4}
  .cb-s{font-size:13px;line-height:1.35;overflow-wrap:anywhere}
  .ces{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;width:100%;padding:14px 22px;border:1.5px solid transparent;border-radius:22px;background:linear-gradient(#000,#000) padding-box,var(--G) border-box;color:#F2ECE4;font:inherit;font-weight:300;text-align:left;box-sizing:border-box}
  .ces-l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
  .ces-bar{flex:1 1 140px;min-width:100px;height:10px;border-radius:10px;border:1px solid rgba(242,236,228,.5);overflow:hidden}
  .ces-bar i{display:block;height:100%;background:var(--G);border-radius:10px}
  .ces-t{flex:1 1 0;min-width:0;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:1180px){.cb{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (max-width:680px){.cb{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cb-t:last-child{grid-column:span 2}.cb-t{min-height:180px;padding:14px 8px}.cb-v{font-size:17px}.ces{padding:12px 14px}.ces-t{flex:1 1 100%;white-space:normal}}

  /* Heaven strip (HeavenStrip.jsx) */
  .hv{position:relative;z-index:1;margin:10px 2px 6px;font-family:'Jost',sans-serif;font-weight:300;color:#000;background:#F2ECE4;border:1px solid #000;border-radius:14px;padding:14px 16px 12px}
  .hv::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:3px;border-radius:3px;background:var(--G135)}
  .hv-row{display:grid;grid-template-columns:minmax(150px,200px) repeat(5,minmax(0,1fr));gap:12px;align-items:stretch}
  .hv-b{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:2px;border:1px solid #000;border-radius:12px;padding:10px 12px;height:84px;min-width:0;font-family:'Jost',sans-serif;color:#000}
  .hv-b:hover,.hv-b:focus-visible{background:#fff}
  .hv-b:focus-visible{outline:2px solid #000;outline-offset:2px}
  .hv-b b{font-weight:300;font-size:32px;line-height:1.05}
  .hv-b span{font-size:15px}
  .hv-b small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hv-all{border:2px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G135) border-box}
  .hv-h{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
  .hv-h b{font-weight:400;font-size:19px}
  .hv-h span{font-size:15px}
  @media(max-width:820px){.hv-row{display:flex;flex-wrap:wrap;gap:8px}.hv-b{flex:1 1 calc(33.333% - 6px);height:auto;min-height:78px;padding:8px 10px}.hv-b.hv-all{flex-basis:100%}.hv-b b{font-size:28px}.hv-b span{font-size:14px}.hv-h{flex-wrap:wrap;gap:2px 12px}}

  /* More detail fold (FocusNow.jsx) + top 10, decisions and rules */
  .fn2-more{border:1px solid #000;border-radius:18px;background:#F2ECE4}
  .fn2-more>summary{cursor:pointer;list-style:none;padding:14px 18px;font-size:17px;color:#000;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fn2-more>summary::-webkit-details-marker{display:none}
  .fn2-more>summary::after{content:"+";margin-left:auto;font-size:22px}
  .fn2-more[open]>summary::after{content:"\2212"}
  .fn2-more>summary:focus-visible{outline:2px solid #000;outline-offset:2px}
  .fn2-more-in{display:flex;flex-direction:column;gap:14px;padding:4px 14px 16px}
  .dn{width:100%;display:flex;flex-direction:column;gap:10px;padding:18px 18px 20px;border-radius:26px;border:1.5px solid transparent;background:linear-gradient(#F2ECE4,#F2ECE4) padding-box,var(--G) border-box;color:#000}
  .dn-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dn-h h2{margin:0;font-size:22px;font-weight:300;color:#000;background:var(--G) left bottom/100% 2px no-repeat;padding-bottom:3px}
  .dn-pill{border:1px solid #000;border-radius:999px;padding:3px 12px;font-size:13px;line-height:1.4;white-space:nowrap;font-weight:400}
  .dn2-list{display:flex;flex-direction:column;gap:0}
  .dn2-li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.14)}
  .dn2-li:last-child{border-bottom:none}
  .dn2-n{width:26px;height:26px;border-radius:13px;background:var(--G135);color:#000;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
  .dn2-lt{flex:1 1 220px;min-width:0;font-size:15px;line-height:1.35;color:#000;overflow-wrap:anywhere}
  .dn2-lt small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .dn2-lt.done{text-decoration:line-through}
  .dn2-st{font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .two h3{margin:0 0 6px;font-weight:400;font-size:16px}
  .two ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .two li{display:flex;gap:10px;align-items:baseline;border-top:1px solid rgba(0,0,0,.16);padding:8px 0;font-size:15px;line-height:1.4}
  .two li:first-child{border-top:none}
  .two li .dia{flex:none;width:8px;height:8px;transform:rotate(45deg);background:var(--G135);border:1px solid #000}

  /* Phone: sidebar becomes a top bar */
  @media(max-width:820px){
    .adm{flex-direction:column}
    .adm-side{position:static;width:100%;height:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 12px}
    .adm-brand{padding:0}
    .adm-gh,.adm-srch,.adm-off{display:none}
    .adm-grp{margin:0;display:flex;gap:6px;flex-wrap:wrap}
    .adm-nb{width:auto;padding:8px 14px;border:1px solid #F2ECE4;border-radius:30px}
    .adm-nb.on{border-color:transparent}
    .adm-main{padding:16px 10px 40px}
    .adm-title{padding:3px 10px;border-radius:12px;gap:8px}
    .adm-ti{width:26px;height:20px;font-size:12px;border-radius:6px}
    .adm-title .adm-h1{font-size:15px}
  }
</style>
</head>
<body>

<div class="adm">

      <div class="adm-gh"><span>Home</span><span aria-hidden="true">&minus;</span></div>
      <a class="adm-nb on" href="bestie-dashboard.html" aria-current="page"><i>&#8962;</i>CEO Dashboard</a>
      <span class="adm-nb adm-off"><i>&#10047;</i>Chat Hub</span>
      <a class="adm-nb" href="bestie-heaven.html"><i>&#10023;</i>Heaven</a>
      <span class="adm-nb adm-off"><i>&#10070;</i>Artifacts</span>
      <span class="adm-nb adm-off"><i>&#8635;</i>Workflows</span>
      <span class="adm-nb adm-off"><i>&#10003;</i>Task Planning</span>
      <span class="adm-nb adm-off"><i>&#9680;</i>Business Planning</span>
      <span class="adm-nb adm-off"><i>&#8627;</i>Workflows</span>
      <span class="adm-nb adm-off"><i>&#10023;</i>Events (Luma)</span>
    </div>
    <div class="adm-grp"><div class="adm-gh"><span>Studio</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Go to market</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Reporting</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Vision</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Finance</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>E-commerce</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Client work</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Sales</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Members</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Settings</span><span aria-hidden="true">+</span></div></div>
    <div class="adm-grp"><div class="adm-gh"><span>Systems</span><span aria-hidden="true">+</span></div></div>
    <span class="adm-nb adm-off" style="margin-top:8px"><i>&#8599;</i>Open the app</span>
  </aside>

  <main class="adm-main">
    <div class="adm-in">
      <div class="adm-title">
        <span class="adm-ti">&#8962;</span>
        <h1 class="adm-h1">CEO Dashboard</h1>
      </div>
      <div class="ck" id="ck"></div>
    </div>
  </main>
</div>

<script>
(function () {
  var D = JSON.parse(document.getElementById('bestie-data').textContent);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pct(n, t) { return t ? Math.round((n / t) * 100) : 0; }

  // ---- Jewel and Diamond: the facet geometry from BuJewel.jsx and CeoCommand.jsx ----
  var uid = 0;
  function ringPts(c, r, n, start) {
    var out = [];
    for (var k = 0; k < n; k++) {
      var a = ((start + (k * 360) / n) * Math.PI) / 180;
      out.push([c + r * Math.cos(a), c + r * Math.sin(a)]);
    }
    return out;
  }
  function P(a) { return a.map(function (q) { return q.map(function (v) { return v.toFixed(1); }).join(','); }).join(' '); }
  function wrapSvg(size, inner) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true" style="display:block;flex:none">' + inner + '</svg>';
  }
  function jewel(size, n, soft, rot) {
    var id = 'g' + (++uid), c = size / 2, r = size / 2 - 3, start = -90 + 180 / n + (rot || 0);
    var o = ringPts(c, r, n, start), inn = ringPts(c, r * 0.56, n, start);
    var fill = soft ? '#F2ECE4' : 'url(#' + id + ')';
    var s = '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E0A0"/><stop offset=".22" stop-color="#E8B870"/><stop offset=".52" stop-color="#BFA5D8"/><stop offset=".78" stop-color="#2CB7A7"/><stop offset="1" stop-color="#167A6B"/></linearGradient></defs>';
    s += '<polygon points="' + P(o) + '" fill="' + fill + '" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>';
    o.forEach(function (q, k) {
      s += '<polygon points="' + P([q, o[(k + 1) % n], inn[(k + 1) % n], inn[k]]) + '" fill="' + (k % 3 === 0 ? '#fff' : '#000') + '" fill-opacity="' + (k % 3 === 0 ? 0.3 : k % 2 ? 0.12 : 0) + '" stroke="#000" stroke-opacity=".28" stroke-width=".7"/>';
    });
    s += '<polygon points="' + P(inn) + '" fill="' + fill + '" stroke="#000" stroke-opacity=".28" stroke-width=".7"/>';
    s += '<polyline points="' + P([o[n - 1], o[0], o[1]]) + '" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>';
    return wrapSvg(size, s);
  }
  function diamond(size, n, rot) {
    var id = 'd' + (++uid), c = size / 2, r = size / 2 - 3, start = -90 + 180 / n + (rot || 0);
    var o = ringPts(c, r, n, start), inn = ringPts(c, r * 0.56, n, start);
    var s = '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#F2ECE4"/><stop offset=".72" stop-color="#BFA5D8" stop-opacity=".28"/><stop offset="1" stop-color="#2CB7A7" stop-opacity=".22"/></linearGradient></defs>';
    s += '<polygon points="' + P(o) + '" fill="#fff"/>';
    s += '<polygon points="' + P(o) + '" fill="url(#' + id + ')" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>';
    o.forEach(function (q, k) {
      s += '<polygon points="' + P([q, o[(k + 1) % n], inn[(k + 1) % n], inn[k]]) + '" fill="' + (k % 2 ? '#BFA5D8' : '#fff') + '" fill-opacity="' + (k % 2 ? 0.16 : 0.7) + '" stroke="#000" stroke-opacity=".22" stroke-width=".7"/>';
    });
    s += '<polygon points="' + P(inn) + '" fill="#fff" fill-opacity=".9" stroke="#000" stroke-opacity=".22" stroke-width=".7"/>';
    s += '<polyline points="' + P([o[n - 1], o[0], o[1]]) + '" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>';
    return wrapSvg(size, s);
  }

  // ---- Status ring (StatusRing in DoThisNext.jsx): one ring, three arcs ----
  function ringChart(parts, total) {
    var R = 46, C = 2 * Math.PI * R;
    var gap = total && parts.filter(function (p) { return p.n; }).length > 1 ? 5 : 0, acc = 0;
    var defs = parts.map(function (p) {
      return '<linearGradient id="dn2g-' + p.k + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + p.a + '"/><stop offset="1" stop-color="' + p.b + '"/></linearGradient>';
    }).join('');
    var arcs = '';
    if (total > 0) {
      parts.forEach(function (p) {
        if (!p.n) return;
        var len = (p.n / total) * C, start = acc; acc += len;
        arcs += '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="url(#dn2g-' + p.k + ')" stroke-width="14" stroke-linecap="butt" stroke-dasharray="' + Math.max(0, len - gap) + ' ' + C + '" stroke-dashoffset="' + (-start) + '" transform="rotate(-90 66 66)"/>';
      });
    }
    var fs = total >= 1000 ? 25 : total >= 100 ? 29 : 34;
    return '<svg width="96" height="96" viewBox="0 0 132 132" role="img" aria-label="' + esc(parts.map(function (p) { return p.l + ' ' + p.n; }).join(', ')) + '" style="flex:none"><defs>' + defs + '</defs>' +
      '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="14"/>' + arcs +
      '<text x="66" y="58.7" text-anchor="middle" dominant-baseline="central" font-family="Jost,sans-serif" font-weight="300" font-size="' + fs + '" fill="#000">' + total.toLocaleString('en-US') + '</text>' +
      '<text x="66" y="83.7" text-anchor="middle" dominant-baseline="central" font-family="Jost,sans-serif" font-weight="300" font-size="12" fill="#000">tasks</text></svg>';
  }

  var state = { mergeOpen: false, opened: false, msg: null, merged: [] };

  function render() {
    document.title = 'Bestie · CEO Dashboard · ' + D.name;
    document.getElementById('brandName').textContent = D.name;

    var c = D.counts, total = c.needsYou + c.inProgress + c.doneWeek;
    var q = D.quarter, n = D.nextUp;
    var merges = D.merge.filter(function (_, i) { return state.merged.indexOf(i) < 0; });

    // 1. Pills row
    var pills =
      '<a class="ck-p' + (c.needsYou ? ' fill' : '') + '" href="#top10" style="text-decoration:none">Needs you <span class="n">' + esc(c.needsYou) + '</span></a>' +
      '<span class="ck-p">In progress <span class="n">' + esc(c.inProgress) + '</span></span>' +
      '<span class="ck-p">Done this week <span class="n">' + esc(c.doneWeek) + '</span></span>' +
      '<span class="ck-p wrap"><b>End goal</b> ' + esc(D.endGoal.text) + ' by ' + esc(D.endGoal.by) + '</span>' +
      '<span class="ck-p wrap"><b>' + esc(q.label) + '</b> ' + esc(q.target) + ' <span class="n">' + esc(q.done) + ' of ' + esc(q.of) + '</span></span>';

    // 2. Merge these
    var mergeHtml = '';
    if (merges.length) {
      mergeHtml = '<div class="mg' + (state.mergeOpen ? '' : ' closed') + '">' +
        '<button type="button" class="mg-tog" id="mergeToggle" aria-expanded="' + state.mergeOpen + '"><b>Merge these ' + merges.length + '</b><span aria-hidden="true">' + (state.mergeOpen ? '–' : '+') + '</span></button>' +
        (state.mergeOpen ? D.merge.map(function (t, i) {
          if (state.merged.indexOf(i) >= 0) return '';
          return '<div class="mg-r"><span class="mg-n">#' + (i + 1) + '</span><span class="mg-t">' + esc(t) + '</span><button type="button" class="df-b" data-merged="' + i + '">Merged ✓</button></div>';
        }).join('') : '') + '</div>';
    }

    // 3. Do this next + ring
    var more = c.needsYou > 1 ? (c.needsYou - 1) + ' more' : 'Last one';
    var next =
      '<div class="dn2-card">' +
        '<div class="dn2-head"><span class="dn2-lab">Do this next</span><span class="dn2-who"><i class="dn2-dia"></i>' + esc(n.owner) + '</span>' + (n.urgent ? '<span class="dn2-who">Urgent</span>' : '') + '</div>' +
        '<span class="dn2-left" role="status">' + esc(more) + '</span>' +
        '<span class="dn2-t">' + esc(n.task) + '</span>' +
        '<span class="dn2-ref">' + esc(state.msg || ('About ' + n.about)) + '</span>' +
        '<div class="dn2-btns">' +
          '<button type="button" class="dn2-b go" id="btnOpen">Open ' + esc(n.about) + '</button>' +
          '<button type="button" class="dn2-b" id="btnAccept"' + (state.opened ? '' : ' disabled title="Open it first"') + '>Accept</button>' +
          '<button type="button" class="dn2-b" id="btnLater">Not now</button>' +
          '<button type="button" class="dn2-b" id="btnDecline">Decline</button>' +
        '</div>' +
        '<button type="button" class="dn2-more" id="btnToday">See today’s tasks (' + D.top10.length + ')</button>' +
      '</div>';
    var parts = [
      { k: 'needs', l: 'Needs you', n: c.needsYou, a: '#F5E0A0', b: '#BFA5D8' },
      { k: 'doing', l: 'In progress', n: c.inProgress, a: '#BFA5D8', b: '#2CB7A7' },
      { k: 'done', l: 'Done this week', n: c.doneWeek, a: '#2CB7A7', b: '#167A6B' }
    ];
    var ring = '<div class="dn2-ring">' + ringChart(parts, total) + '<div class="dn2-nums">' +
      parts.map(function (p) {
        return '<div class="dn2-num"><i class="dn2-dot" style="background:linear-gradient(135deg,' + p.a + ',' + p.b + ')"></i><b>' + p.n.toLocaleString('en-US') + '</b><span>' + esc(p.l) + '</span>' + (total > 0 ? '<i>' + pct(p.n, total) + '%</i>' : '') + '</div>';
      }).join('') + '</div></div>';

    // 4. Seven black jewel boxes
    var boxes = '<div class="cb">' + D.jewels.map(function (j, i) {
      var pic = (i % 2 === 0 && i < 6) ? diamond(56, [8, 10, 9][i / 2], i * 17) : jewel(56, [7, 6, 8, 5][(i - 1) >> 1] || 8, false, i * 17);
      return '<div class="cb-t">' + pic + '<span class="cb-l">' + esc(j.label) + '</span><span class="cb-v" title="' + esc(j.value) + '">' + esc(j.value) + '</span><span class="cb-s">' + esc(j.sub) + '</span></div>';
    }).join('') + '</div>';

    // 5. Energy bar
    var e = D.energy;
    var energy = '<div class="ces">' + jewel(26, 6, !e.left, 0) +
      '<span class="ces-l">Energy left today</span>' +
      '<span style="font-size:26px">' + esc(e.left) + ' <span style="font-size:14px">of ' + esc(e.of) + '</span></span>' +
      '<span class="ces-bar" aria-hidden="true"><i style="width:' + Math.max(2, Math.min(100, pct(e.left, e.of))) + '%"></i></span>' +
      '<span class="ces-t"><span class="ces-l">Drains </span>' + esc(e.drains) + '</span>' +
      '<span class="ces-t"><span class="ces-l">Gives </span>' + esc(e.gives) + '</span></div>';

    // 6. Happening today
    var today = '';
    if (D.today && D.today.length) {
      today = '<div class="dn2-strip" aria-label="Happening today"><b>Happening today</b>' + D.today.map(function (r) {
        return '<span class="a"><i class="dn2-dia"></i>' + esc(r.area) + ' ' +
          (r.done ? '<span><b>' + esc(r.done) + '</b> done</span>' : '') + (r.done && r.doing ? ' · ' : '') +
          (r.doing ? '<span><b>' + esc(r.doing) + '</b> in progress</span>' : '') + '</span>';
      }).join('') + '</div>';
    }

    // 7. Heaven strip
    var h = D.heaven, all = h.idea + h.decision + h.planted + h.growing + h.manifested;
    function hb(num, label, sub, cls) {
      return '<a class="hv-b ' + (cls || '') + '" href="bestie-heaven.html"><b>' + num + '</b><span>' + label + '</span><small>' + sub + '</small></a>';
    }
    function items(x) { return x === 1 ? '1 item' : x + ' items'; }
    var heaven = '<div class="hv"><div class="hv-h"><b>Heaven</b><span>Every idea, decision and seed, by stage. Tap a number to see them.</span></div><div class="hv-row">' +
      hb(all, 'In Heaven', 'All stages', 'hv-all') +
      hb(h.idea, 'Idea', items(h.idea)) + hb(h.decision, 'Decision', items(h.decision)) + hb(h.planted, 'Planted', items(h.planted)) +
      hb(h.growing, 'Growing', items(h.growing)) + hb(h.manifested, 'Manifested', items(h.manifested)) + '</div></div>';

    // 8. More detail: top 10, decisions and rules
    var topList = D.top10.map(function (t, i) {
      var done = t.status === 'done';
      return '<div class="dn2-li"><span class="dn2-n">' + (i + 1) + '</span><span class="dn2-lt' + (done ? ' done' : '') + '">' + esc(t.task) + '<small>' + esc(t.owner) + '</small></span><span class="dn2-st">' + esc(done ? 'Done' : t.due) + '</span></div>';
    }).join('');
    var moreHtml = '<details class="fn2-more" id="more" open><summary>More detail: top 10, decisions and rules</summary><div class="fn2-more-in">' +
      '<div class="dn" id="top10"><div class="dn-h"><h2>Top 10</h2><span class="dn-pill">' + D.top10.length + ' items, with owners</span></div><div class="dn2-list">' + topList + '</div></div>' +
      '<div class="dn"><div class="dn-h"><h2>Decisions and rules</h2></div><div class="two">' +
        '<div><h3>Decisions</h3><ul>' + D.decisions.map(function (d) { return '<li><i class="dia"></i><span>' + esc(d) + '</span></li>'; }).join('') + '</ul></div>' +
        '<div><h3>Rules</h3><ul>' + D.rules.map(function (r) { return '<li><i class="dia"></i><span>' + esc(r) + '</span></li>'; }).join('') + '</ul></div>' +
      '</div></div></div></details>';

    document.getElementById('ck').innerHTML =
      '<div class="clk"><span>' + esc(D.now) + '</span><span>Updated ' + esc(D.updated) + '</span></div>' +
      '<div class="ck-bar">' + pills + '</div>' + mergeHtml +
      '<div class="dn2-row">' + next + ring + '</div>' +
      boxes + energy + today + heaven + moreHtml;
  }

  // Example board only: these buttons change the page in your browser, they do not save. Bestie updates the data block.
  document.getElementById('ck').addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.id === 'mergeToggle') { state.mergeOpen = !state.mergeOpen; }
    else if (t.hasAttribute('data-merged')) { state.merged.push(+t.getAttribute('data-merged')); }
    else if (t.id === 'btnOpen') { state.opened = true; state.msg = 'Opened. Accept is ready.'; }
    else if (t.id === 'btnAccept') { state.msg = 'Accepted. Bestie moves it to the top of the list.'; }
    else if (t.id === 'btnLater') { state.msg = 'Parked for later. Bestie asks again tomorrow.'; }
    else if (t.id === 'btnDecline') { state.msg = 'Declined. Bestie takes it off the list.'; }
    else if (t.id === 'btnToday') { var m = document.getElementById('more'); m.open = true; document.getElementById('top10').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    else return;
    render();
  });

  render();
})();
</script>
